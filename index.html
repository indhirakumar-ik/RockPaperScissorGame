<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockPaperScissorGame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div>
            <h1>Rock | Paper | Scissor Game</h1>
            <h1>✊🖐️✌️</h1>
        </div>


        <div class="button">
            <button id="rock" onclick="playgame('rock')">Rock🪨</button>
            <button id="paper📜" onclick="playgame('paper')">Paper📜</button>
            <button id="scissor" onclick="playgame('scissor')">Scissor✂️</button>
        </div>

        <div class="resultcontainer">
            <div id="actualResult">
                <p id="youroption">Your option:</p>
                <p id="computeroption">Computer option:</p>
                <p id="result">Result:</p>
    
                <p id="yourscore">Your score</p>
                <p id="computerscore">Computer score</p>
            </div>
        </div>

        <div class="resetcontainer">
            <button id="reset" onclick="reset()">Reset</button>
        </div>
    </div>

    


    <script src="script.js"></script>
</body>
</html>
